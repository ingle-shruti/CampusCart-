<style>

<div class="container">

```
<h1>Edit Product</h1>
<p class="subtitle">Update product details and upload a product image.</p>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Product Name</label>
    <input type="text" name="name" value="{{ product.name }}" required>

    <label>Description</label>
    <textarea name="description" required>{{ product.description }}</textarea>

    <label>Price (₹)</label>
    <input type="number" name="price" value="{{ product.price }}" min="0.01" step="0.01" required>

    <label>Category</label>
    <select name="category" required>
        <option value="Books" {% if product.category == "Books" %}selected{% endif %}>Books</option>
        <option value="Electronics" {% if product.category == "Electronics" %}selected{% endif %}>Electronics</option>
        <option value="Notes" {% if product.category == "Notes" %}selected{% endif %}>Notes</option>
        <option value="Stationery" {% if product.category == "Stationery" %}selected{% endif %}>Stationery</option>
        <option value="Others" {% if product.category == "Others" %}selected{% endif %}>Others</option>
    </select>

    <label>Condition</label>
    <select name="condition" required>
        <option value="New" {% if product.condition == "New" %}selected{% endif %}>New</option>
        <option value="Like New" {% if product.condition == "Like New" %}selected{% endif %}>Like New</option>
        <option value="Used" {% if product.condition == "Used" %}selected{% endif %}>Used</option>
    </select>

    <label>Current Product Image</label>

    {% if product.image %}
    <div class="current-image">
        <img src="{% url 'product_image' product_id=product.id %}" alt="{{ product.name }}">
    </div>
    {% else %}
    <p class="note">No image uploaded yet.</p>
    {% endif %}

    <label>Upload New Image</label>
    <input type="file" name="image" accept="image/jpeg,image/png,image/webp">

    <p class="note">JPG, PNG or WEBP. Maximum size: 5 MB. Leave empty to keep the existing image.</p>

    <div class="buttons">
        <button type="submit">Update Product</button>
        <a href="{% url 'admin_products' %}" class="back-btn">Back</a>
    </div>

</form>
```
